[project]
name = "liff-schedule-backend"
version = "0.1.0"
description = "LINE 團隊行程助理後端"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "tzdata>=2024.1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
