# 本專案自己的 nginx：只在 docker 網路內接受主機共用對外 nginx 轉來的流量。
# 對外 TLS 由共用 nginx（*.b856dev.com 憑證）與 Cloudflare 處理。

limit_req_zone $binary_remote_addr zone=liff_api:10m rate=10r/s;

server {
    listen 80;
    server_name liff.b856dev.com;

    # 取得使用者真實 IP（Cloudflare → 共用 nginx → 這裡）
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 1m;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        limit_req zone=liff_api burst=30 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # LINE webhook 不限流（LINE 會批次重送），簽章驗證在應用程式內
    location = /api/line/webhook {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
