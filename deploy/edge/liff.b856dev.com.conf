# 放進主機共用對外 nginx 的 /opt/nginx/conf.d/。只負責 TLS 與把 liff.b856dev.com 轉給本專案自己的 liff-nginx。
# 格式比照同目錄的 ems.b856dev.com.conf；憑證為 certbot 自動續期的 *.b856dev.com。
server {
    listen 443 ssl;
    server_name liff.b856dev.com;

    ssl_certificate     /etc/letsencrypt/live/b856dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b856dev.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        # 以變數搭配 resolver：liff-nginx 尚未啟動時，共用 nginx 仍可正常載入與重啟
        resolver 127.0.0.11 valid=30s;
        set $liff_upstream http://liff-nginx:80;
        proxy_pass $liff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
